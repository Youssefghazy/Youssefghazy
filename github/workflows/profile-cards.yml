# Regenerates the live cards in profile/ (contribution snake + GitHub stats).
# Everything is generated inside this repo, so the README never depends on
# a public stats server being up. Uses the built-in GITHUB_TOKEN only.
name: Refresh profile cards

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Contribution snake (coral, dark + light)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-dark.svg?palette=github-dark&color_snake=#fe6060&color_dots=#161b22,#4a1d1d,#8f2f2f,#d64848,#ff8b72
            profile/snake-light.svg?palette=github-light&color_snake=#fe6060&color_dots=#ebedf0,#ffd6cf,#ffab9c,#ff7f70,#fe6060

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide=stars&hide_rank=false&bg_color=0a0a0c&title_color=fe6060&icon_color=ff8b72&text_color=d6d6d6&ring_color=fe6060&border_color=26262b&border_radius=16&custom_title=GitHub%20at%20a%20glance
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&exclude_repo=Weejet&bg_color=0a0a0c&title_color=fe6060&text_color=d6d6d6&border_color=26262b&border_radius=16&custom_title=Most%20used%20languages
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: refresh profile cards"
          git push
